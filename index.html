<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dashboard Financiero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10;
  --surface:#12151a;
  --surface2:#1a1e25;
  --border:#242832;
  --text:#e8eaed;
  --text-muted:#8a9099;
  --accent:#22c55e;
  --accent-dim:rgba(34,197,94,0.12);
  --red:#ef4444;
  --red-dim:rgba(239,68,68,0.12);
  --amber:#f59e0b;
  --amber-dim:rgba(245,158,11,0.12);
  --blue:#3b82f6;
  --purple:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:14px;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:78px;
}
header.top{
  position:sticky;top:0;z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:16px 16px 12px;
}
header.top h1{font-size:17px;font-weight:800;}
header.top .sub{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--text-muted);}
.month-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-family:'JetBrains Mono',monospace;}

main{padding:14px 14px 24px;max-width:640px;margin:0 auto;}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}
.card h2{font-size:14.5px;font-weight:700;margin-bottom:12px;}

.placeholder{
  text-align:center;
  padding:40px 16px;
  color:var(--text-muted);
  font-size:13px;
}
.placeholder .ic{font-size:32px;margin-bottom:10px;opacity:0.6;}
.placeholder .todo{
  margin-top:10px;
  display:inline-block;
  background:var(--amber-dim);
  color:var(--amber);
  border:1px solid var(--amber);
  border-radius:8px;
  padding:4px 10px;
  font-size:11px;
}

nav.tabs{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;
  z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:auto;
}
nav.tabs button{
  flex:1;min-width:0;
  background:none;border:none;
  color:var(--text-muted);
  font-size:10px;
  padding:9px 2px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  white-space:nowrap;
}
nav.tabs button .ic{font-size:17px;}
nav.tabs button.active{color:var(--accent);}

.tab-content{display:none;}
.tab-content.active{display:block;}

/* ---- Deudas ---- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:2px;}
.stat-box{background:var(--surface2);border-radius:10px;padding:10px 12px;}
.stat-box .label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px;}
.stat-box .value{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;}
.stat-box .value.accent{color:var(--accent);}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-muted);margin-bottom:10px;}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;}

.debt-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.debt-row:last-child{border-bottom:none;}
.debt-badge{width:8px;height:34px;border-radius:4px;flex-shrink:0;}
.debt-badge.tarjeta{background:var(--blue);}
.debt-badge.prestamo{background:var(--purple);}
.debt-badge.carro{background:var(--amber);}
.debt-row .info{flex:1;min-width:0;}
.debt-row .name{font-size:13.5px;font-weight:600;}
.debt-row .meta{font-size:11px;color:var(--text-muted);margin-top:2px;line-height:1.4;}
.debt-row .amt{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;text-align:right;white-space:nowrap;}
.debt-row .actions{display:flex;gap:2px;margin-top:4px;justify-content:flex-end;}
.icon-btn{background:none;border:none;color:var(--text-muted);font-size:14px;cursor:pointer;padding:3px 5px;}
.icon-btn:hover{color:var(--accent);}

.edit-block{padding:12px 0;border-bottom:1px solid var(--border);}
.edit-block label{display:block;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.3px;margin:8px 0 4px;}
.edit-block input,.edit-block select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:9px 10px;font-family:'JetBrains Mono',monospace;}
.edit-block .btn-row{display:flex;gap:8px;margin-top:12px;}
.btn{flex:1;background:var(--accent);color:#0f1117;border:none;border-radius:9px;padding:11px;font-weight:700;font-size:13.5px;cursor:pointer;}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn.danger{background:var(--red-dim);color:var(--red);border:1px solid var(--red);}
.btn.full{width:100%;}

/* ---- Pagos semana ---- */
.mesnav{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.mesnav .lbl{font-weight:700;font-size:14px;}
.mesnav button{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 12px;font-size:12.5px;cursor:pointer;}
.mesnav button:disabled{opacity:0.35;cursor:default;}

.box-row{display:flex;gap:10px;}
.box-row .card{flex:1;margin-bottom:0;padding:12px 14px;}
.box-row .label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px;}
.box-row .val{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;}
.box-row .val.live{color:var(--accent);}
.box-row input.manual{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;padding:8px 10px;font-family:'JetBrains Mono',monospace;margin-top:2px;}

.sem-head{font-weight:700;font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;color:var(--text-muted);}
.sem-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.sem-item:last-child{border-bottom:none;}
.sem-item.checked{opacity:0.45;}
.sem-check{width:21px;height:21px;border-radius:6px;border:2px solid var(--border);background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--accent);margin-top:1px;}
.sem-check.on{background:var(--accent-dim);border-color:var(--accent);}
.sem-item .info{flex:1;min-width:0;}
.sem-item .nom{font-size:13px;font-weight:600;}
.sem-item.checked .nom{text-decoration:line-through;}
.sem-item .meta{font-size:10.5px;color:var(--text-muted);margin-top:1px;}
.sem-item .monto{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;white-space:nowrap;}
.sem-item .monto.in{color:var(--accent);}
.sem-item .pagarcompleta{display:block;margin-top:4px;background:none;border:none;color:var(--blue);font-size:10.5px;cursor:pointer;text-decoration:underline;padding:0;}
.sem-item.pausado{opacity:0.4;font-style:italic;}

.sem-resumen{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--border);}
.sem-resumen b{color:var(--text);font-family:'JetBrains Mono',monospace;}
.alerta-semana{border-radius:10px;padding:9px 11px;margin-top:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;}
.alerta-semana.bad{background:var(--red-dim);color:var(--red);border:1px solid var(--red);}
.alerta-semana.ok{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);}

/* ---- Cheques ---- */
.colchon-banner{border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid;}
.colchon-banner.pos{background:var(--accent-dim);border-color:var(--accent);}
.colchon-banner.neg{background:var(--red-dim);border-color:var(--red);}
.colchon-banner .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;font-weight:700;}
.colchon-banner.pos .tag{color:var(--accent);}
.colchon-banner.neg .tag{color:var(--red);}
.colchon-banner .amt{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;margin-top:4px;}
.colchon-banner .detail{font-size:11.5px;color:var(--text-muted);margin-top:6px;line-height:1.5;}

.cheque-card{margin-bottom:12px;}
.cheque-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.cheque-card .head .fuente{font-weight:700;font-size:14px;}
.cheque-card .head .fecha{font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;}
.cheque-card .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.cheque-card .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px;}
.cheque-card label{display:block;font-size:9.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:3px;}
.cheque-card input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;padding:7px 8px;font-family:'JetBrains Mono',monospace;}
.cheque-card .estimado-box{background:var(--surface2);border-radius:9px;padding:8px 10px;font-size:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.cheque-card .estimado-box .num{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--blue);}
.cheque-card .diff-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:4px;}
.cheque-card .diff-row .v{font-family:'JetBrains Mono',monospace;font-weight:700;}
.cubierto-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--text-muted);}
.cubierto-chk{width:18px;height:18px;border-radius:5px;border:2px solid var(--border);background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:var(--accent);}
.cubierto-chk.on{background:var(--accent-dim);border-color:var(--accent);}
.historico-tag{font-size:10px;background:var(--surface2);color:var(--text-muted);border-radius:6px;padding:2px 7px;}

/* ---- Proyección ---- */
.retiro-banner,.emilio-banner{border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--blue);background:rgba(59,130,246,0.1);}
.emilio-banner{border-color:var(--purple);background:rgba(167,139,250,0.1);}
.retiro-banner .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;font-weight:700;color:var(--blue);}
.emilio-banner .tag{color:var(--purple);}
.retiro-banner .name,.emilio-banner .name{font-size:16px;font-weight:700;margin-top:4px;}
.retiro-banner .detail,.emilio-banner .detail{font-size:11.5px;color:var(--text-muted);margin-top:6px;line-height:1.6;}
.mes-extra-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
.mes-extra-row:last-child{border-bottom:none;}
.mes-extra-row .lbl{font-size:12.5px;font-weight:600;}
.mes-extra-row input{width:100px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;padding:6px 8px;font-family:'JetBrains Mono',monospace;text-align:right;}
.liberacion-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.liberacion-row:last-child{border-bottom:none;}
.liberacion-row .m{font-family:'JetBrains Mono',monospace;color:var(--text-muted);width:56px;flex-shrink:0;}
.liberacion-row .n{flex:1;}
.liberacion-row .tag-retiro{color:var(--blue);font-size:10.5px;}
.liberacion-row .tag-emilio{color:var(--purple);font-size:10.5px;}
.liberacion-row .tag-done{color:var(--accent);font-size:10.5px;}

/* ---- Crédito ---- */
.util-banner{border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid;background:var(--surface2);}
.util-banner .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;font-weight:700;}
.util-banner .name{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;margin-top:4px;}
.util-banner .detail{font-size:11.5px;color:var(--text-muted);margin-top:6px;line-height:1.5;}
.score-box{text-align:center;padding:14px 0;}
.score-box .num{font-family:'JetBrains Mono',monospace;font-size:40px;font-weight:700;}
.score-box .sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
.score-box .comp{font-size:11.5px;color:var(--text-muted);margin-top:8px;}
.card-credito{margin-bottom:10px;}
.card-credito .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;}

.card-credito .sinlimite{color:var(--text-muted);font-size:11.5px;white-space:nowrap;}
.card-credito .grid3b{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:12px;}
.card-credito .grid3b .k{color:var(--text-muted);font-size:10px;text-transform:uppercase;margin-bottom:2px;}
.card-credito .grid3b .v{font-family:'JetBrains Mono',monospace;font-weight:600;}

/* ---- Historial ---- */
.hist-month{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.hist-month .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.hist-month .head .lbl{font-size:14px;font-weight:700;}
.hist-month .head .fecha{font-size:10.5px;color:var(--text-muted);}
.hist-month .metrics{display:flex;gap:16px;margin-bottom:8px;font-size:11.5px;color:var(--text-muted);}
.hist-month .metrics b{color:var(--text);font-family:'JetBrains Mono',monospace;}
.hist-cheque-row{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;border-top:1px dashed var(--border);}
.hist-cheque-row:first-child{border-top:none;}
.hist-actions{display:flex;gap:8px;margin-top:8px;}
</style>
</head>

/* ---------------- Cookie storage (chunked) — mismo mecanismo probado en snowball-dashboard.html ---------------- */
function setCookie(name, value, days) {
  const d = new Date(Date.now() + (days || 365) * 864e5).toUTCString();
  document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + d + '; path=/; SameSite=Lax';
}
function getCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.$?*|{}()[\]\\/+^]/g, '\\$&') + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
function deleteCookie(name) {
  document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
}

const CHUNK_SIZE = 3500; // margen seguro bajo el límite de ~4096 bytes por cookie

function saveData(key, obj) {
  const json = JSON.stringify(obj);
  // limpia chunks previos de esta key
  let i = 0;
  while (getCookie(key + '_' + i) !== null) { deleteCookie(key + '_' + i); i++; }
  deleteCookie(key + '_meta');

  const chunks = [];
  for (let pos = 0; pos < json.length; pos += CHUNK_SIZE) {
    chunks.push(json.slice(pos, pos + CHUNK_SIZE));
  }
  chunks.forEach((chunk, idx) => setCookie(key + '_' + idx, chunk, 365));
  setCookie(key + '_meta', String(chunks.length), 365);
}

function loadData(key, fallback) {
  const count = parseInt(getCookie(key + '_meta') || '0', 10);
  if (!count) return fallback;
  let json = '';
  for (let i = 0; i < count; i++) {
    const chunk = getCookie(key + '_' + i);
    if (chunk === null) return fallback; // datos corruptos/incompletos
    json += chunk;
  }
  try { return JSON.parse(json); } catch (e) { return fallback; }
}

/* ---------------- Navegación de pestañas ---------------- */
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('nav.tabs button').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelector('nav.tabs button[data-tab="' + tab + '"]').classList.add('active');
  saveData('du_lasttab', tab);
}

function fmt(n) {
  const num = Number(n) || 0;
  const sign = num < 0 ? '-' : '';
  return sign + '$' + Math.abs(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function tipoLabel(t) { return t === 'tarjeta' ? 'Tarjeta' : t === 'prestamo' ? 'Préstamo' : 'Carro'; }
function esPlazoFijo(t) { return t === 'prestamo' || t === 'carro'; }
function uidDebt() { return 'd_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function totalDeuda() { return debts.reduce((s, d) => s + Number(d.balance || 0), 0); }
function totalMinimos() { return debts.reduce((s, d) => s + Number(d.min || 0), 0); }
function tasaPromedioPonderada() {
  const total = totalDeuda();
  if (total <= 0) return 0;
  return debts.reduce((s, d) => s + Number(d.balance || 0) * Number(d.rate || 0), 0) / total;
}

function saveEditDebt(id) {

function deleteDebt(id) {

  renderCreditoTab();
  renderResumenTab();

const N_MESES_DISPONIBLES = 12;

// Cadena real de cheques semanales, alternando Baylor/Carey+Aramark, ambos viernes,
// desde el ancla confirmada: 31-jul-2026 = Baylor $1,700 (real, ya cobrado).
// IMPORTANTE (corrección del usuario): el ÚLTIMO cheque que cae dentro de un mes
// (el que aterriza en la semana 4, día ~28) NO es dinero de ese mes — es el saldo
// inicial con el que arranca la semana 1 del mes siguiente, antes de que llegue
// el primer cheque de ese mes siguiente. Por eso cada mes solo "gasta" los cheques
// que caen en sus semanas 1-3, y el de semana 4 se traslada.
const CHECK_ANCHOR = new Date(2026, 6, 31); // 31 julio 2026
function chequeInfo(i) {
  const date = new Date(CHECK_ANCHOR.getTime() + i * 7 * 86400000);
  const fuente = i % 2 === 0 ? 'Baylor Medical' : 'Carey + Aramark';
  const monto = i === 0 ? 1700 : (i % 2 === 0 ? 1500 : 1800); // i=0 es el real ya cobrado; el resto presupuestado
  return { i, date, fuente, monto, day: date.getDate() };
}
function chequesDelMes(y, m) {
  const todos = [];
  for (let i = 0; i < 100; i++) {
    const c = chequeInfo(i);
    if (c.date.getFullYear() === y && c.date.getMonth() === m) todos.push(c);
    if (c.date.getFullYear() > y + 1) break;
  }
  todos.sort((a, b) => a.date - b.date);
  const deferido = todos.length ? todos[todos.length - 1] : null;
  const mostrados = todos.slice(0, -1); // todos menos el último (semana 1-3)
  return { mostrados, deferido };
}
function saldoBaseSugerido(y, m) {
  // Agosto 2026 es un caso especial confirmado: cheque real del 31-jul ($1,700) + $500 sobrante de julio = $2,200
  if (y === 2026 && m === 7) return 2200;
  let py = y, pm = m - 1;
  if (pm < 0) { pm = 11; py--; }
  const prev = chequesDelMes(py, pm);
  return prev.deferido ? prev.deferido.monto : 0;
}

function fijosDelMes(y, m) {
  const mk = ymKey(y, m);
  return FIJOS_TEMPLATE.map((f, i) => {
    const item = { ...f, idx: i, key: 'fijo_' + i };
    // pausas
    if (f.pausaKey === 'mamavero') {
      item.pausado = (y === 2026 && m === 7); // agosto 2026 = mes 7 (0-index)
    }
    // deudas: monto dinámico ligado a du_debts (única fuente de verdad)
    if (f.debtKey) {
      const d = debts.find(x => x.name === f.debtKey);
      if (!d || d.balance <= 0.005) {
        item.pausado = true;
        item.pausadoTxt = 'ya liquidada';
      } else {
        item.monto = f.quincenal ? Math.round((d.min / 2) * 100) / 100 : d.min;
      }
    }
    if (f.debtKeyForCompleta) {
      const d = debts.find(x => x.name === f.debtKeyForCompleta);
      if (!d || d.balance <= 0.005) { item.pausado = true; item.pausadoTxt = 'ya liquidada'; }
    }
    // montos editables (ej. "Casa" — compras reales varían semana a semana, no siempre es el mismo monto)
    if (f.editable) {
      const override = pagState.montosEditados[mk + '|' + item.key];
      if (override !== undefined) item.monto = override;
    }
    return item;
  });
}

function updateMontoEditado(mesKey, key, val) {
  const num = val === '' ? undefined : parseFloat(val);
  if (num === undefined || isNaN(num)) delete pagState.montosEditados[mesKey + '|' + key];
  else pagState.montosEditados[mesKey + '|' + key] = num;
  guardarPagState();

}

function togglePagoFijo(mesKey, item) {
  const key = mesKey + '|' + item.key;
  const yaMarcado = !!pagState.pagosMarcados[key];
  if (!yaMarcado) {
    // marcar como pagado: si está ligado a una deuda (min payment), reduce el saldo real
    const debtName = item.debtKey || item.debtKeyForCompleta;
    if (debtName && item.debtKey) { // solo min payments quincenales/mensuales reducen saldo, no los "pagar completa"
      const d = debts.find(x => x.name === debtName);
      if (d) {
        d.balance = Math.max(0, Math.round((d.balance - item.monto) * 100) / 100);
        saveData('du_debts', debts);
      }
    }
    pagState.pagosMarcados[key] = true;
    pagState.montoAplicado[key] = item.monto;
  } else {
    // desmarcar: revertir exactamente el monto que se aplicó
    const montoRevertir = pagState.montoAplicado[key] || 0;
    const debtName = item.debtKey || item.debtKeyForCompleta;
    if (debtName && item.debtKey) {
      const d = debts.find(x => x.name === debtName);
      if (d) {
        d.balance = Math.round((d.balance + montoRevertir) * 100) / 100;
        saveData('du_debts', debts);
      }
    }
    pagState.pagosMarcados[key] = false;
    delete pagState.montoAplicado[key];
  }
  guardarPagState();
  renderPagosSemanaTab();
  renderDeudasTab();
  renderProyeccionTab();
  renderCreditoTab();
  renderResumenTab();
}

function toggleChequeMarcado(mesKey, cheque) {
  const key = mesKey + '|' + (cheque.esAramarkPar ? cheque.i : 'cheque_' + cheque.i);
  pagState.pagosMarcados[key] = !pagState.pagosMarcados[key];

  const d = debts.find(x => x.name === debtName);
  if (!d) return;

}
function updateSaldoSobranteAnt(mesKey, val) {
  pagState.saldoSobranteAnt[mesKey] = val === '' ? 0 : parseFloat(val);
  guardarPagState();
  renderPagosSemanaTab();
}

function agregarVariable(mesKey, semanaIdx) {
  const descEl = document.getElementById('var_desc_' + mesKey + '_' + semanaIdx);
  const montoEl = document.getElementById('var_monto_' + mesKey + '_' + semanaIdx);
  const desc = (descEl.value || 'Gasto variable').trim();
  const monto = parseFloat(montoEl.value) || 0;
  if (monto <= 0) return;
  if (!pagState.variables[mesKey]) pagState.variables[mesKey] = [];
  pagState.variables[mesKey].push({ id: uidDebt(), desc, monto, semana: semanaIdx });
  guardarPagState();
  renderPagosSemanaTab();
}
function eliminarVariable(mesKey, id) {
  if (!pagState.variables[mesKey]) return;
  pagState.variables[mesKey] = pagState.variables[mesKey].filter(v => v.id !== id);
  guardarPagState();
  renderPagosSemanaTab();
}

function renderPagosSemana() {
  const { y, m } = mesIdxToYM(pagState.mesIdx);
  const mk = ymKey(y, m);
  const ult = lastDayOfMonth(y, m);
  const fijos = fijosDelMes(y, m);
  const { mostrados: careyBaylor, deferido } = chequesDelMes(y, m);

  // Aramark (Vero) llega prácticamente el mismo día que Carey (según confirmaste con los comprobantes).
  // Se pega justo debajo de cada cheque de Carey, usando EL MISMO día que Carey para que
  // no queden separados de semana — aunque en la cadena real caiga 1 día antes.
  const cheques = [];
  careyBaylor.forEach(c => {
    cheques.push(c);
    if (c.fuente === 'Carey + Aramark') {
      const ai = (c.i + 1) / 2;
      const a = aramarkChequeInfo(ai);
      cheques.push({ i: 'aramark_' + ai, date: a.date, fuente: 'Aramark (Vero)', monto: BASELINE_ARAMARK, day: c.day, esAramarkPar: true });
    }
  });
  let deferidoAramark = null;
  if (deferido && deferido.fuente === 'Carey + Aramark') {
    const ai = (deferido.i + 1) / 2;
    const a = aramarkChequeInfo(ai);
    deferidoAramark = { fuente: 'Aramark (Vero)', monto: BASELINE_ARAMARK, day: deferido.day };
  }

  const tieneBaseManual = Object.prototype.hasOwnProperty.call(pagState.saldoRealBase, mk);
  const saldoBase = tieneBaseManual ? pagState.saldoRealBase[mk] : saldoBaseSugerido(y, m);
  const sobranteAnt = pagState.saldoSobranteAnt[mk] || 0;
  const variablesMes = pagState.variables[mk] || [];

  // "Saldo real hoy" en vivo: base + sobrante anterior + cheques marcados - fijos marcados - variables
  let saldoLive = saldoBase + sobranteAnt;
  fijos.forEach(f => { if (!f.pausado && pagState.pagosMarcados[mk + '|' + f.key]) saldoLive -= f.monto; });
  cheques.forEach(c => { if (pagState.pagosMarcados[mk + '|' + (c.esAramarkPar ? c.i : 'cheque_' + c.i)]) saldoLive += c.monto; });
  variablesMes.forEach(v => { saldoLive -= v.monto; });

  const nextMonthLabel = (() => { let ny = y, nm = m + 1; if (nm > 11) { nm = 0; ny++; } return MESES_LARGO[nm] + ' ' + ny; })();

  const bloques = [[1, 7], [8, 14], [15, 21], [22, ult]];
  const semanasHtml = bloques.map((b, wi) => {
    const itemsFijos = fijos.filter(f => f.day >= b[0] && f.day <= b[1]);
    const itemsCheques = cheques.filter(c => c.day >= b[0] && c.day <= b[1]);
    const itemsVariables = variablesMes.filter(v => v.semana === wi);
    const totalVariablesSemana = itemsVariables.reduce((s, v) => s + v.monto, 0);
    const esUltimaSemana = wi === bloques.length - 1;
    const activos = itemsFijos.filter(f => !f.pausado);
    const totalSemana = activos.reduce((s, f) => s + f.monto, 0);
    const pendienteSemana = activos.filter(f => !pagState.pagosMarcados[mk + '|' + f.key]).reduce((s, f) => s + f.monto, 0);
    const alcanza = saldoLive >= pendienteSemana;
    const alerta = pendienteSemana > 0.005 ? `
      <div class="alerta-semana ${alcanza ? 'ok' : 'bad'}">
        ${alcanza
          ? `✅ Tu saldo actual cubre lo pendiente de esta semana (sobrarían ${fmt(saldoLive - pendienteSemana)})`
          : `⚠️ Con tu saldo real hoy no alcanza para lo pendiente de esta semana — te faltan ${fmt(pendienteSemana - saldoLive)}`}
      </div>` : '';
    const filas = [
      ...itemsCheques.map(c => renderChequeRow(mk, c)),
      ...itemsFijos.map(f => renderFijoRow(mk, f))
    ].join('');
    const filasVariables = itemsVariables.map(v => `
      <div class="sem-item">
        <div class="sem-check" style="visibility:hidden;"></div>
        <div class="info">
          <div class="nom">🛒 ${v.desc}</div>
          <div class="meta">gasto variable</div>
        </div>
        <div class="monto">-${fmt(v.monto)}</div>
        <button class="icon-btn" onclick="eliminarVariable('${mk}','${v.id}')" style="margin-left:4px;">🗑️</button>
      </div>`).join('');
    const variablesBlock = `
      <div style="padding:8px 0;border-top:1px dashed var(--border);margin-top:4px;">
        ${filasVariables}
        <div style="display:flex;gap:6px;margin-top:6px;">
          <input type="text" id="var_desc_${mk}_${wi}" placeholder="ej. Restaurante, Amazon..." style="flex:1.3;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;padding:7px 8px;">
          <input type="number" step="0.01" id="var_monto_${mk}_${wi}" placeholder="$" style="flex:0.7;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;padding:7px 8px;font-family:'JetBrains Mono',monospace;">
          <button class="icon-btn" onclick="agregarVariable('${mk}',${wi})" style="background:var(--accent-dim);color:var(--accent);border-radius:7px;padding:0 10px;font-size:16px;">+</button>
        </div>
        ${totalVariablesSemana > 0 ? `<div style="font-size:10.5px;color:var(--text-muted);margin-top:4px;">Total variable esta semana: ${fmt(totalVariablesSemana)}</div>` : ''}
      </div>`;
    const notaDiferido = (esUltimaSemana && deferido) ? `
      <div class="sem-item pausado">
        <div class="sem-check"></div>
        <div class="info">
          <div class="nom">${deferido.fuente} (${deferido.day}-${MESES_LARGO[m].slice(0,3).toLowerCase()})</div>
          <div class="meta">no se gasta este mes — pasa como saldo inicial de ${nextMonthLabel}</div>
        </div>
        <div class="monto">${fmt(deferido.monto)}</div>
      </div>
      ${deferidoAramark ? `
      <div class="sem-item pausado">
        <div class="sem-check"></div>
        <div class="info">
          <div class="nom">${deferidoAramark.fuente} (${deferidoAramark.day}-${MESES_LARGO[m].slice(0,3).toLowerCase()})</div>
          <div class="meta">no se gasta este mes — pasa como saldo inicial de ${nextMonthLabel}</div>
        </div>
        <div class="monto">${fmt(deferidoAramark.monto)}</div>
      </div>` : ''}` : '';
    return `
      <div class="card">
        <div class="sem-head"><span>Semana ${wi + 1} (día ${b[0]}–${b[1]})</span></div>
        <div class="sem-resumen">
          <span>Total a pagar: <b>${fmt(totalSemana)}</b></span>
          <span>Pendiente: <b style="color:${pendienteSemana>0.005?'var(--amber)':'var(--accent)'}">${fmt(pendienteSemana)}</b></span>
        </div>
        ${filas || '<div style="font-size:12px;color:var(--text-muted);">Sin movimientos.</div>'}
        ${notaDiferido}
        ${variablesBlock}
        ${alerta}
      </div>`;
  }).join('');

  return `
    <div class="card mesnav">
      <button onclick="cambiarMesPagState(-1)" ${pagState.mesIdx === 0 ? 'disabled' : ''}>← Anterior</button>
      <span class="lbl">${MESES_LARGO[m]} ${y}</span>
      <button onclick="cambiarMesPagState(1)" ${pagState.mesIdx === N_MESES_DISPONIBLES - 1 ? 'disabled' : ''}>Siguiente →</button>
    </div>
    <div class="box-row">
      <div class="card">
        <div class="label">💳 Saldo real hoy</div>
        <div class="val live">${fmt(saldoLive)}</div>
        <input class="manual" type="number" step="0.01" value="${saldoBase}" onchange="updateSaldoRealBase('${mk}', this.value)">
        <div style="font-size:10px;color:var(--text-muted);margin-top:4px;">↑ saldo base del mes${tieneBaseManual ? '' : ' (sugerido — edítalo si no cuadra)'}</div>
      </div>
      <div class="card">
        <div class="label">💰 Sobró del mes anterior</div>
        <input class="manual" type="number" step="0.01" value="${sobranteAnt}" onchange="updateSaldoSobranteAnt('${mk}', this.value)">
        <div style="font-size:10px;color:var(--text-muted);margin-top:4px;">casi siempre $0 — ya se abona a deuda al cierre</div>
      </div>
    </div>
    ${semanasHtml}
  `;
}

function renderChequeRow(mk, c) {
  const key = mk + '|' + (c.esAramarkPar ? c.i : 'cheque_' + c.i);
  const checked = !!pagState.pagosMarcados[key];
  return `
    <div class="sem-item ${checked ? 'checked' : ''}">
      <div class="sem-check ${checked ? 'on' : ''}" onclick='toggleChequeMarcado("${mk}", ${JSON.stringify(c)})'>${checked ? '✓' : ''}</div>
      <div class="info">
        <div class="nom">+ ${c.fuente}</div>
        <div class="meta">día ${c.day} · monto presupuestado (no el real de Cheques)</div>
      </div>
      <div class="monto in">+${fmt(c.monto)}</div>
    </div>`;
}

function renderFijoRow(mk, f) {
  if (f.pausado) {
    return `
      <div class="sem-item pausado">
        <div class="sem-check"></div>
        <div class="info">
          <div class="nom">${f.name}</div>
          <div class="meta">día ${f.day} · ${f.pausadoTxt || 'pausado este mes'}</div>
        </div>
        <div class="monto">—</div>
      </div>`;
  }
  const key = mk + '|' + f.key;
  const checked = !!pagState.pagosMarcados[key];
  const debtName = f.debtKey || f.debtKeyForCompleta;
  const botonCompleta = debtName ? `<button class="pagarcompleta" onclick="pagarDeudaCompletaSemana('${debtName}')">Pagar completa</button>` : '';
  const editorMonto = f.editable ? `
        <div style="display:flex;align-items:center;gap:6px;margin-top:5px;">
          <span style="font-size:10px;color:var(--text-muted);">Gasto real:</span>
          <input type="number" step="0.01" value="${f.monto}" onchange="updateMontoEditado('${mk}','${f.key}', this.value)"
            style="width:80px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11.5px;padding:3px 6px;font-family:'JetBrains Mono',monospace;">
        </div>` : '';
  return `
    <div class="sem-item ${checked ? 'checked' : ''}">
      <div class="sem-check ${checked ? 'on' : ''}" onclick='togglePagoFijo("${mk}", ${JSON.stringify(f)})'>${checked ? '✓' : ''}</div>
      <div class="info">
        <div class="nom">${f.name}</div>
        <div class="meta">día ${f.day}${f.debtKey ? ' · solo mínimo' : ''}${f.meta ? ' · ' + f.meta : ''}</div>
        ${botonCompleta}
        ${editorMonto}
      </div>
      <div class="monto">-${fmt(f.monto)}</div>
    </div>`;
}

function renderPagosSemanaTab() {
  const el = document.getElementById('pagossem-container');
  if (el) el.innerHTML = renderPagosSemana();
}

/* ================= CHEQUES ================= */
// Carey/Baylor: cadena de CHECK_ANCHOR (viernes, definida en Pagos semana).
// Aramark: cadena PROPIA — es el sueldo de Vero, NO va pegado al cheque de Carey.
// Confirmado con 7 comprobantes reales subidos al proyecto: quincenal, siempre jueves,
// tarifa $16.43/h regular + ~$17.33/h en horas con diferencial de turno, deducción real 25.02%.
const TARIFA_REGULAR_CAREY = 23;
const TARIFA_OVERTIME_CAREY = 34.50;
const DEDUCCION_CAREY = 0.2727; // confirmado en comprobantes ADP de Jhoan

const TARIFA_REGULAR_ARAMARK = 16.43;
const TARIFA_DIFERENCIAL_ARAMARK = 17.33; // promedio de los ~$17.23-$17.43/h de shift diff vistos en los comprobantes
const DEDUCCION_ARAMARK = 0.2502; // confirmado en 7 comprobantes reales de Vero (excluyendo el mes con descuento único de zapatos)

// Baylor (Vero) — confirmado con 5 comprobantes ADP reales (mayo-julio 2026).
// Sin diferenciales por separado (nocturno/fin de semana son centavos, ya absorbidos en la tarifa OT blended) — calculadora simple a propósito.
const TARIFA_REGULAR_BAYLOR = 18.12;
const TARIFA_OVERTIME_BAYLOR = 27.69; // tarifa efectiva blended (incluye el 0.5x de FLSA sobre tarifa regular ajustada), consistente en los 5 comprobantes
const DEDUCCION_BAYLOR = 0.2443; // promedio real de los 5 comprobantes (rango 24.00%-25.06%)

const BASELINE_CAREY = 1800;   // base para el colchón
const BASELINE_ARAMARK = 300;  // esperado MÍNIMO confirmado — Aramark no tiene monto fijo, este es el piso
const BASELINE_BAYLOR = 1500;  // esperado ya usado en la cadena de Pagos semana

const ARAMARK_ANCHOR = new Date(2026, 6, 23); // 23-jul-2026, jueves, cheque real ya confirmado en comprobante

// Esperado especial de Carey en semanas con cierre/feriado (proyección conocida, NO es "real" todavía).
const ESPERADO_ESPECIAL_CAREY = {
  '2026-09-18': 1572.42, // Labor Day
  '2026-12-11': 1384.23, // Thanksgiving
  '2026-12-25': 1702.06, // pierde el viernes 18
  '2027-01-08': 936.76,  // vacación/feriados fin de año
};

let chqState = loadData('du_cheques', null);
if (!chqState) {
  chqState = { real: {}, cubierto: {}, horasCareyCalc: { reg: 105, ot: 0, vac: 0 } };
  saveData('du_cheques', chqState);
}
function guardarChqState() { saveData('du_cheques', chqState); }

function aramarkChequeInfo(i) {
  const date = new Date(ARAMARK_ANCHOR.getTime() + i * 14 * 86400000);
  return { i, date, fuente: 'Aramark (Vero)', day: date.getDate() };
}

function todosChequesDelMes(y, m) {
  const todos = [];
  for (let i = 0; i < 100; i++) {
    const c = chequeInfo(i);
    if (c.date.getFullYear() === y && c.date.getMonth() === m) todos.push({ ...c, tipo: 'careybaylor' });
    if (c.date.getFullYear() > y + 1) break;
  }
  for (let i = -20; i < 100; i++) { // -20 para poder ver quincenas de Aramark anteriores al ancla si se navega hacia atrás
    const c = aramarkChequeInfo(i);
    if (c.date.getFullYear() === y && c.date.getMonth() === m) todos.push({ ...c, tipo: 'aramark' });
    if (c.date.getFullYear() > y + 1) break;
  }
  todos.sort((a, b) => a.date - b.date);
  return todos;
}
function fechaISO(date) { return date.toISOString().slice(0, 10); }

function esperadoCarey(iso) { return ESPERADO_ESPECIAL_CAREY[iso] !== undefined ? ESPERADO_ESPECIAL_CAREY[iso] : BASELINE_CAREY; }

function updateChequeReal(key, val) {
  chqState.real[key] = val === '' ? undefined : parseFloat(val);
  if (chqState.real[key] === undefined) delete chqState.real[key];
  guardarChqState();
  renderChequesTab();
}
function toggleChequeCubierto(key) {
  chqState.cubierto[key] = !chqState.cubierto[key];
  guardarChqState();
  renderChequesTab();
}

/* ---- Calculadora única de Carey (arriba de la lista) — no se guarda, solo orienta.
   Aramark y Baylor tienen su propia calculadora aparte (calculadora-vero.html), para Vero. ---- */
function calcularEstimadoCarey() {
  const reg = parseFloat(document.getElementById('calc_carey_reg').value) || 0;
  const ot = parseFloat(document.getElementById('calc_carey_ot').value) || 0;
  const vac = parseFloat(document.getElementById('calc_carey_vac').value) || 0;
  const gross = reg * TARIFA_REGULAR_CAREY + ot * TARIFA_OVERTIME_CAREY + vac * TARIFA_REGULAR_CAREY;
  const neto = gross * (1 - DEDUCCION_CAREY);
  const el = document.getElementById('calc_carey_resultado');
  if (el) el.innerHTML = `${fmt(neto)} <span style="font-size:11px;color:var(--text-muted);font-weight:400;">neto (${fmt(gross)} gross)</span>`;
  return neto;
}

function colchonAcumuladoTotal() {
  // Colchón COMPARTIDO: suma (real - esperado_base) de Carey, Aramark Y Baylor, los tres al mismo pozo.
  let colchon = 0, n = 0;
  const { y: endY, m: endM } = mesIdxToYM(N_MESES_DISPONIBLES - 1);
  const endDate = new Date(endY, endM + 1, 0);
  for (let i = 0; i < 200; i++) {
    const c = chequeInfo(i);
    if (c.date > endDate) break;
    if (i % 2 === 1) { // impar = Carey
      const realCarey = chqState.real[i + '_carey'];
      if (realCarey !== undefined) { colchon += (realCarey - BASELINE_CAREY); n++; }
    } else { // par = Baylor
      const realBaylor = chqState.real[i + '_baylor'];
      if (realBaylor !== undefined) { colchon += (realBaylor - BASELINE_BAYLOR); n++; }
    }
  }
  for (let i = -20; i < 200; i++) {
    const c = aramarkChequeInfo(i);
    if (c.date > endDate) break;
    const realAramark = chqState.real['aramark_' + i];
    if (realAramark !== undefined) { colchon += (realAramark - BASELINE_ARAMARK); n++; }
  }
  return { colchon, n };
}

function renderSubcheque(label, key, esperado) {
  const real = chqState.real[key];
  const cubierto = !!chqState.cubierto[key];
  const diff = real !== undefined ? real - esperado : null;
  return `
    <div>
      <div style="font-size:12.5px;font-weight:700;margin-bottom:6px;">${label}</div>
      <div class="grid2">
        <div><label>Esperado</label><input type="number" value="${esperado}" readonly style="opacity:0.6;"></div>
        <div><label>Real</label><input type="number" step="0.01" value="${real !== undefined ? real : ''}" placeholder="— aún no llega" onchange="updateChequeReal('${key}', this.value)"></div>
      </div>
      ${diff !== null ? `
        <div class="diff-row">
          <span style="color:var(--text-muted);">Diferencia vs. esperado</span>
          <span class="v" style="color:${diff>=0?'var(--accent)':'var(--red)'}">${diff>=0?'+':''}${fmt(diff)}</span>
        </div>` : ''}
      <div class="cubierto-row">
        <div class="cubierto-chk ${cubierto?'on':''}" onclick="toggleChequeCubierto('${key}')">${cubierto?'✓':''}</div>
        <span>Faltante/sobrante ya cubierto con el colchón</span>
      </div>
    </div>`;
}

function renderChequeCard(c) {
  const iso = fechaISO(c.date);
  if (c.tipo === 'careybaylor') {
    const esCarey = c.fuente === 'Carey + Aramark';
    if (esCarey) {
      const esperCarey = esperadoCarey(iso);
      return `
        <div class="card cheque-card">
          <div class="head"><span class="fuente">💼 Carey (Jhoan)</span><span class="fecha">${iso}</span></div>
          ${renderSubcheque('Carey', c.i + '_carey', esperCarey)}
        </div>`;
    }
    const esHistorico = c.i === 0;
    return `
      <div class="card cheque-card">
        <div class="head"><span class="fuente">Baylor Medical${esHistorico ? ' <span class="historico-tag">ya cobrado</span>' : ''}</span><span class="fecha">${iso}</span></div>
        ${renderSubcheque('Baylor', c.i + '_baylor', c.monto)}
      </div>`;
  }
  // Aramark (Vero)
  return `
    <div class="card cheque-card">
      <div class="head"><span class="fuente">🏢 Aramark (Vero)</span><span class="fecha">${iso}</span></div>
      ${renderSubcheque('Aramark', 'aramark_' + c.i, BASELINE_ARAMARK)}
    </div>`;
}

function renderCheques() {
  const { y, m } = mesIdxToYM(pagState.mesIdx);
  const todos = todosChequesDelMes(y, m);
  const { colchon, n } = colchonAcumuladoTotal();
  const hcC = chqState.horasCareyCalc || { reg: 105, ot: 0, vac: 0 };

  return `
    <div class="colchon-banner ${colchon >= 0 ? 'pos' : 'neg'}">
      <div class="tag">${colchon >= 0 ? 'Colchón acumulado (compartido)' : 'Colchón acumulado — en negativo'}</div>
      <div class="amt">${fmt(colchon)}</div>
      <div class="detail">Suma de (real − esperado base) en los ${n} cheques de Carey ($1,800), Aramark ($300 mínimo) y Baylor ($1,500) que ya tienen valor real cargado — un solo pozo, el dinero de Jhoan y Vero se usa en conjunto.</div>
    </div>

    <div class="card">
      <h2>🧮 Calculadora Carey (Jhoan)</h2>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;">Quincenal: 105h = 10.5h × 5 días × 2 semanas. Solo te muestra el estimado — no se guarda.</div>
      <div class="grid3">
        <div><label>Horas regulares</label><input type="number" step="0.25" id="calc_carey_reg" value="${hcC.reg}" oninput="calcularEstimadoCarey()"></div>
        <div><label>Horas overtime</label><input type="number" step="0.25" id="calc_carey_ot" value="${hcC.ot}" oninput="calcularEstimadoCarey()"></div>
        <div><label>Horas vacación</label><input type="number" step="0.25" id="calc_carey_vac" value="${hcC.vac}" oninput="calcularEstimadoCarey()"></div>
      </div>
      <div class="estimado-box" style="margin-top:8px;">
        <span>$23/h reg · $34.50/h OT · deducción 27.27%</span>
        <span class="num" id="calc_carey_resultado">—</span>
      </div>
      <div style="font-size:10.5px;color:var(--text-muted);margin-top:8px;">Aramark y Baylor tienen su propia calculadora aparte, para Vero (calculadora-vero.html).</div>
    </div>

    <div class="card mesnav">
      <button onclick="cambiarMesPagState(-1)" ${pagState.mesIdx === 0 ? 'disabled' : ''}>← Anterior</button>
      <span class="lbl">${MESES_LARGO[m]} ${y}</span>
      <button onclick="cambiarMesPagState(1)" ${pagState.mesIdx === N_MESES_DISPONIBLES - 1 ? 'disabled' : ''}>Siguiente →</button>
    </div>
    ${todos.map(renderChequeCard).join('') || '<div class="card"><div class="placeholder">Sin cheques este mes.</div></div>'}
  `;

/* ================= PROYECCIÓN ================= */
// Tío Emilio — préstamo especial fuera de la tabla de deudas (interés puro $170/mes, capital $5,300 pago único).
const EMILIO = { capital: 5300, interesMensual: 170 };
// Retiro 401k — ya decidido: $24,000, con un ratio de liquidación (payoff) confirmado para Regional Finance J.
const RETIRO_MONTO = 24000;
const RETIRO_PAYOFF_RATIO = 5390.64 / 7252.49; // liquidación con descuento ya confirmada
const MES1_PROY = new Date(2026, 6, 1); // mes 1 = julio 2026 (mismo criterio que el resto del proyecto)

function mesNumALabel(mesNum) {
  const d = new Date(MES1_PROY);
  d.setMonth(d.getMonth() + mesNum - 1);
  const label = d.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' });
  return label.charAt(0).toUpperCase() + label.slice(1);
}

let proyState = loadData('du_proyeccion', null);
if (!proyState) {
  proyState = { extraPorMes: {}, extraDefault: 0, mesRetiro: 7, emilioAcumulado: 0, emilioPagado: false };
  saveData('du_proyeccion', proyState);
}
function guardarProyState() { saveData('du_proyeccion', proyState); }

function extraDelMes(mesNum) {
  return proyState.extraPorMes[mesNum] !== undefined ? proyState.extraPorMes[mesNum] : proyState.extraDefault;
}
function updateExtraMes(mesNum, val) {
  if (val === '') delete proyState.extraPorMes[mesNum];
  else proyState.extraPorMes[mesNum] = parseFloat(val) || 0;
  guardarProyState();
  renderProyeccionTab();
  renderCreditoTab();
  renderResumenTab();
}
function updateExtraDefault(val) {
  proyState.extraDefault = val === '' ? 0 : parseFloat(val) || 0;
  guardarProyState();
  renderProyeccionTab();
  renderCreditoTab();
  renderResumenTab();
}
function updateMesRetiro(val) {
  proyState.mesRetiro = Math.max(1, parseInt(val) || 1);
  guardarProyState();
  renderProyeccionTab();
  renderCreditoTab();
  renderResumenTab();
}

function runSimulacionProyeccion() {
  const active = debts.filter(d => d.balance > 0.005).map(d => ({ ...d }));
  const balances = {}; active.forEach(d => balances[d.id] = d.balance);
  const mins = {}; active.forEach(d => mins[d.id] = d.min);
  const rates = {}; active.forEach(d => rates[d.id] = d.rate);

  let emilioAhorro = 0, emilioPagado = false;
  let totalInteres = 0, intEmilio = 0;
  let month = 0;
  const freedEvents = [];
  const mesRetiro = proyState.mesRetiro;

  while ((Object.values(balances).some(b => b > 0.005) || !emilioPagado) && month < 400) {
    month++;

    // 1. Interés mensual de cada deuda activa
    Object.keys(balances).forEach(id => {
      if (balances[id] > 0.005) {
        const i = balances[id] * rates[id] / 12;
        totalInteres += i;
        balances[id] += i;
      }
    });

    // 2. Interés de Tío Emilio (fijo, mientras no esté pagado)
    if (!emilioPagado) intEmilio += EMILIO.interesMensual;

    // 3. Retiro 401k en el mes configurado
    if (month === mesRetiro) {
      let retiro = RETIRO_MONTO;
      const reg = active.find(d => d.name === 'Regional Finance J.');
      if (reg && balances[reg.id] > 0.005) {
        const payoff = balances[reg.id] * RETIRO_PAYOFF_RATIO;
        retiro -= payoff;
        balances[reg.id] = 0;
        freedEvents.push({ month, id: reg.id, tipo: 'pagado-retiro' });
      }
      const tarjetasOrden = active.filter(d => d.tipo === 'tarjeta' && balances[d.id] > 0.005).sort((a, b) => b.min - a.min);
      for (const d of tarjetasOrden) {
        if (retiro <= 0) break;
        if (balances[d.id] <= retiro) { retiro -= balances[d.id]; balances[d.id] = 0; freedEvents.push({ month, id: d.id, tipo: 'pagado-retiro' }); }
        else { balances[d.id] -= retiro; retiro = 0; }
      }
      if (retiro > 0 && !emilioPagado) {
        emilioAhorro += retiro;
        if (emilioAhorro >= EMILIO.capital) emilioPagado = true;
      }
    }

    // 4. Pagar mínimos
    Object.keys(balances).forEach(id => {
      if (balances[id] > 0.005) {
        const pay = Math.min(mins[id], balances[id]);
        balances[id] -= pay;
        if (balances[id] < 0.005) balances[id] = 0;
      }
    });

    // 5. Extra del mes (editable individualmente) + mínimos ya liberados de deudas pagadas
    const liberados = active.filter(d => balances[d.id] <= 0.005).reduce((s, d) => s + mins[d.id], 0);
    let extra = extraDelMes(month) + liberados;

    // 6. Después del retiro, el flujo va primero a Tío Emilio
    if (!emilioPagado && month >= mesRetiro) {
      const flujoEmilio = Math.min(extra, EMILIO.capital - emilioAhorro);
      emilioAhorro += flujoEmilio;
      extra -= flujoEmilio;
      if (emilioAhorro >= EMILIO.capital - 0.01) {
        emilioPagado = true;
        extra += (emilioAhorro - EMILIO.capital);
        emilioAhorro = EMILIO.capital;
        freedEvents.push({ month, id: 'emilio', tipo: 'emilio-pagado' });
      }
    }

    // 7. Extra restante → snowball (saldo menor primero)
    const activeSorted = active.filter(d => balances[d.id] > 0.005).sort((a, b) => balances[a.id] - balances[b.id]);
    for (const d of activeSorted) {
      if (extra <= 0.005) break;
      const pay = Math.min(extra, balances[d.id]);
      balances[d.id] -= pay; extra -= pay;
      if (balances[d.id] < 0.005) balances[d.id] = 0;
    }

    // 8. Detectar liberaciones nuevas (snowball normal)
    active.forEach(d => {
      if (balances[d.id] <= 0.005 && !freedEvents.find(e => e.id === d.id)) {
        freedEvents.push({ month, id: d.id, tipo: 'snowball' });
      }
    });

    if (month > 1 && Object.values(balances).every(b => b <= 0.005) && emilioPagado) break;
  }

  return { totalMonths: month, totalInteres, intEmilio, freedEvents, emilioAhorro, emilioPagado };
}

  const sim = runSimulacionProyeccion();
  const mesRetiro = proyState.mesRetiro;

/* ================= CRÉDITO ================= */
// Lee en vivo del mismo arreglo `debts` (única fuente de verdad) — se actualiza sola
// cuando cambian saldos en Deudas o se marcan pagos en Pagos semana, sin lógica propia de saldo.
// Cada persona ve: sus cuentas individuales + las conjuntas + las de las que es autorizado
// (un autorizado sí suele aparecer en el reporte de crédito de esa persona también).
let creditState = loadData('du_credit', null);
if (!creditState) {
  creditState = {
    personaActiva: 'jhoan',
    jhoan: { scoreBase: 573, historialNivel: 5, mixNivel: 3 },
    vero: { scoreBase: 573, historialNivel: 5, mixNivel: 3 },
  };
  saveData('du_credit', creditState);
}
function guardarCreditState() { saveData('du_credit', creditState); }

function semaforoUtil(pct) {
  if (pct <= 10) return { color: 'var(--accent)', label: '🟢 Ideal' };
  if (pct <= 30) return { color: 'var(--amber)', label: '🟡 Aceptable' };
  return { color: 'var(--red)', label: '🔴 Alto' };
}
function ratingUtil(pct) { if (pct <= 10) return 5; if (pct <= 30) return 4; if (pct <= 50) return 3; if (pct <= 75) return 2; return 1; }
function ratingAntiguedad(anios) { if (anios >= 9) return 5; if (anios >= 5) return 4; if (anios >= 2) return 3; if (anios >= 1) return 2; return 1; }
function calcularEstimadoScore(utilTotal, antigProm, historialNivel, mixNivel) {
  const rUtil = ratingUtil(utilTotal);
  const rAntig = antigProm != null ? ratingAntiguedad(antigProm) : 3;
  const ponderado = historialNivel * 0.35 + rUtil * 0.30 + rAntig * 0.15 + mixNivel * 0.20;
  return Math.round(300 + (ponderado - 1) / 4 * 550);
}

function debtsDePersona(persona) {
  return debts.filter(d => d.titular === persona || d.autorizado === persona || d.titular === 'conjunta');
}

function switchCreditoPersona(persona) {
  creditState.personaActiva = persona;
  guardarCreditState();
  renderCreditoTab();
  renderResumenTab();
}
function updateCreditSetting(persona, field, val) {
  creditState[persona][field] = (field === 'scoreBase') ? (parseFloat(val) || 0) : parseInt(val);
  guardarCreditState();
  renderCreditoTab();
  renderResumenTab();
}
function updateCardLimiteCredito(id, val) {
  const d = debts.find(x => x.id === id);
  if (!d) return;
  d.limite = val === '' ? null : parseFloat(val);
  saveData('du_debts', debts);
  renderCreditoTab();
  renderDeudasTab();
}
function updateCardAntiguedadCredito(id, val) {
  const d = debts.find(x => x.id === id);
  if (!d) return;
  d.antiguedad = val === '' ? null : parseFloat(val);
  saveData('du_debts', debts);
  renderCreditoTab();
  renderDeudasTab();
}

function renderPanelPersona(persona, nombreLabel) {
  const st = creditState[persona];
  const misDebts = debtsDePersona(persona);
  const tarjetas = misDebts.filter(d => d.tipo === 'tarjeta');
  const conLimite = tarjetas.filter(d => d.limite != null && d.limite > 0);
  const limiteTotal = conLimite.reduce((s, d) => s + d.limite, 0);
  const saldoTotal = conLimite.reduce((s, d) => s + d.balance, 0);
  const utilTotal = limiteTotal > 0 ? (saldoTotal / limiteTotal * 100) : 0;
  const conAntiguedad = tarjetas.filter(d => d.antiguedad != null && d.antiguedad > 0);
  const antigProm = conAntiguedad.length > 0 ? conAntiguedad.reduce((s, d) => s + d.antiguedad, 0) / conAntiguedad.length : null;
  const sem = semaforoUtil(utilTotal);
  const scoreEstimado = calcularEstimadoScore(utilTotal, antigProm, st.historialNivel, st.mixNivel);
  const diff = scoreEstimado - st.scoreBase;

  const filas = tarjetas.map(d => {
    const util = (d.limite != null && d.limite > 0) ? (d.balance / d.limite * 100) : null;
    const s = util != null ? semaforoUtil(util) : null;
    const rolTxt = d.titular === 'conjunta' ? 'conjunta' : (d.titular === persona ? 'titular' : `autorizado (titular: ${d.titular === 'jhoan' ? 'Jhoan' : 'Vero'})`);
    return `
      <div class="card card-credito">
        <div class="head">
          <span class="name">${d.name} <span style="font-size:10px;color:var(--text-muted);font-weight:400;">(${rolTxt})</span></span>
          ${util != null ? `<span class="util" style="color:${s.color}">${util.toFixed(1)}%</span>` : `<span class="sinlimite">sin límite</span>`}
        </div>
        <div class="grid3b">
          <div><div class="k">Saldo</div><div class="v">${fmt(d.balance)}</div></div>
          <div><div class="k">Límite</div><input type="number" value="${d.limite!=null?d.limite:''}" placeholder="—" onchange="updateCardLimiteCredito('${d.id}',this.value)" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;padding:5px 7px;font-family:'JetBrains Mono',monospace;"></div>
          <div><div class="k">Antigüedad (años)</div><input type="number" step="0.1" value="${d.antiguedad!=null?d.antiguedad:''}" placeholder="—" onchange="updateCardAntiguedadCredito('${d.id}',this.value)" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;padding:5px 7px;font-family:'JetBrains Mono',monospace;"></div>
        </div>
      </div>`;
  }).join('') || '<div class="card"><div class="placeholder">Sin tarjetas registradas.</div></div>';

  return `
    <div class="util-banner" style="border-color:${sem.color};">
      <div class="tag" style="color:${sem.color}">${sem.label} — Utilización de ${nombreLabel}</div>
      <div class="name" style="color:${sem.color}">${limiteTotal>0?utilTotal.toFixed(1)+'%':'—'}</div>
      <div class="detail">${fmt(saldoTotal)} de ${fmt(limiteTotal)} en límite combinado${antigProm!=null?` · antigüedad promedio: ${antigProm.toFixed(1)} años`:''}</div>
    </div>
    <div class="card">
      <div class="stat-grid">
        <div class="stat-box"><div class="label">Saldo en tarjetas</div><div class="value">${fmt(saldoTotal)}</div></div>
        <div class="stat-box"><div class="label">Límite total</div><div class="value">${limiteTotal>0?fmt(limiteTotal):'—'}</div></div>
      </div>
    </div>
    <div class="card">
      <h2 style="margin-bottom:4px;">🎯 Estimador de puntaje — ${nombreLabel} (ilustrativo)</h2>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:12px;line-height:1.5;">
        No es tu puntaje real — las agencias usan modelos propietarios. Aproximación educativa con los pesos conocidos de FICO (historial 35%, utilización 30%, antigüedad 15%, mezcla/nuevo crédito 20%).
      </div>
      <div class="score-box">
        <div class="num" style="color:${scoreEstimado>=670?'var(--accent)':scoreEstimado>=580?'var(--amber)':'var(--red)'}">${scoreEstimado}</div>
        <div class="sub">estimado, rango 300–850</div>
        <div class="comp">Puntaje real conocido: <b style="color:var(--text)">${st.scoreBase}</b> · diferencia: <b style="color:${diff>=0?'var(--accent)':'var(--red)'}">${diff>=0?'+':''}${diff}</b></div>
      </div>
      <div style="margin-bottom:10px;">
        <label style="font-size:11px;color:var(--text-muted);text-transform:uppercase;display:block;margin-bottom:5px;">Puntaje real conocido de ${nombreLabel} (Credit Karma, etc.)</label>

          <option value="5" ${st.mixNivel==5?'selected':''}>Variada (tarjetas+préstamos+carro), sin cuentas nuevas</option>

/* ================= HISTORIAL ================= */
// Cerrar un mes toma una "foto" de: lo programado vs. lo realmente marcado en Pagos semana,
// esperado vs. real de cada cheque del mes, y el saldo total de deuda en ese momento —
// para poder comparar cumplimiento real vs. proyectado más adelante.
let historialState = loadData('du_historial', []);
function guardarHistorial() { saveData('du_historial', historialState); }

function snapshotMes(y, m) {
  const mk = ymKey(y, m);
  const fijos = fijosDelMes(y, m);
  const activos = fijos.filter(f => !f.pausado);
  const totalProgramado = activos.reduce((s, f) => s + f.monto, 0);
  const totalPagado = activos.filter(f => pagState.pagosMarcados[mk + '|' + f.key]).reduce((s, f) => s + f.monto, 0);

  const chequesMes = todosChequesDelMes(y, m);
  const chequesResumen = chequesMes.map(c => {
    const iso = fechaISO(c.date);
    if (c.tipo === 'careybaylor') {
      if (c.fuente === 'Carey + Aramark') {
        return { fuente: 'Carey', fecha: iso, esperado: esperadoCarey(iso), real: chqState.real[c.i + '_carey'] ?? null };
      }
      return { fuente: 'Baylor', fecha: iso, esperado: c.monto, real: chqState.real[c.i + '_baylor'] ?? null };
    }
    return { fuente: 'Aramark', fecha: iso, esperado: BASELINE_ARAMARK, real: chqState.real['aramark_' + c.i] ?? null };
  });

  return {
    mk, mesLabel: MESES_LARGO[m] + ' ' + y,
    fechaCierre: new Date().toISOString().slice(0, 10),
    totalProgramado, totalPagado,
    pctCumplimiento: totalProgramado > 0 ? (totalPagado / totalProgramado * 100) : 0,
    chequesResumen,
    deudaTotalCierre: totalDeuda(),
  };
}

function cerrarMes(idx) {
  const { y, m } = mesIdxToYM(idx);
  const mk = ymKey(y, m);
  const yaExiste = historialState.find(h => h.mk === mk);
  if (yaExiste && !confirm(`${MESES_LARGO[m]} ${y} ya está cerrado en el historial. ¿Reemplazar con los datos actuales?`)) return;
  const snap = snapshotMes(y, m);
  historialState = historialState.filter(h => h.mk !== mk);
  historialState.push(snap);
  historialState.sort((a, b) => a.mk.localeCompare(b.mk));
  guardarHistorial();
  renderHistorialTab();
}

function eliminarCierre(mk) {
  if (!confirm('¿Eliminar este mes del historial? No afecta los datos de Pagos semana ni Cheques.')) return;
  historialState = historialState.filter(h => h.mk !== mk);
  guardarHistorial();
  renderHistorialTab();
}

function copiarResumenMes(mk) {
  const h = historialState.find(x => x.mk === mk);
  if (!h) return;
  const chequesTxt = h.chequesResumen.map(c => `  ${c.fecha} ${c.fuente}: esperado ${fmt(c.esperado)} · real ${c.real !== null ? fmt(c.real) : '—'}`).join('\n');
  const texto = `${h.mesLabel} — cerrado ${h.fechaCierre}
Fijos: ${fmt(h.totalPagado)} pagado de ${fmt(h.totalProgramado)} programado (${h.pctCumplimiento.toFixed(0)}%)
Deuda total al cierre: ${fmt(h.deudaTotalCierre)}
Cheques:
${chequesTxt}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(texto).then(() => alert('Resumen copiado — pégalo donde quieras guardarlo.'));
  } else {
    alert(texto);
  }
}

function renderHistorial() {
  const opciones = [];
  for (let i = 0; i < N_MESES_DISPONIBLES; i++) {
    const { y, m } = mesIdxToYM(i);
    opciones.push(`<option value="${i}">${MESES_LARGO[m]} ${y}</option>`);
  }

  const ordenado = [...historialState].sort((a, b) => b.mk.localeCompare(a.mk));
  const lista = ordenado.map(h => {
    const cumpliColor = h.pctCumplimiento >= 90 ? 'var(--accent)' : h.pctCumplimiento >= 60 ? 'var(--amber)' : 'var(--red)';
    const idxPrev = ordenado.indexOf(h) + 1;
    const prev = ordenado[idxPrev];
    const deudaDelta = prev ? h.deudaTotalCierre - prev.deudaTotalCierre : null;
    return `
      <div class="hist-month">
        <div class="head">
          <span class="lbl">${h.mesLabel}</span>
          <span class="fecha">cerrado ${h.fechaCierre}</span>
        </div>
        <div class="metrics">
          <span>Fijos: <b style="color:${cumpliColor}">${h.pctCumplimiento.toFixed(0)}%</b></span>
          <span>${fmt(h.totalPagado)} / ${fmt(h.totalProgramado)}</span>
        </div>
        <div class="metrics">
          <span>Deuda al cierre: <b>${fmt(h.deudaTotalCierre)}</b></span>
          ${deudaDelta !== null ? `<span style="color:${deudaDelta<=0?'var(--accent)':'var(--red)'}">${deudaDelta<=0?'▼':'▲'} ${fmt(Math.abs(deudaDelta))} vs mes anterior</span>` : ''}
        </div>
        <div style="margin-top:6px;">
          ${h.chequesResumen.map(c => `
            <div class="hist-cheque-row">
              <span>${c.fecha} ${c.fuente}</span>
              <span>${fmt(c.esperado)} esp. · ${c.real!==null?fmt(c.real):'—'} real</span>
            </div>`).join('')}
        </div>
        <div class="hist-actions">
          <button class="btn secondary" style="padding:8px;font-size:12px;" onclick="copiarResumenMes('${h.mk}')">📋 Copiar resumen</button>
          <button class="btn danger" style="padding:8px;font-size:12px;" onclick="eliminarCierre('${h.mk}')">🗑️ Eliminar</button>
        </div>
      </div>`;
  }).join('') || '<div class="card"><div class="placeholder">Sin meses cerrados todavía.</div></div>';

  return `
    <div class="card">
      <h2>Cerrar un mes</h2>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;">Guarda una foto de lo programado vs. lo pagado, los cheques esperado vs. real, y el saldo de deuda de ese momento — para comparar después.</div>
      <select id="hist-mes-select" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 10px;font-family:'JetBrains Mono',monospace;margin-bottom:10px;">
        ${opciones.join('')}
      </select>
      <button class="btn full" onclick="cerrarMes(parseInt(document.getElementById('hist-mes-select').value))">Cerrar este mes</button>
    </div>
    <div style="margin:16px 4px 10px;">
      <h2 style="font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;margin:0;">Meses cerrados (${historialState.length})</h2>
    </div>
    ${lista}
  `;
}

function renderHistorialTab() {
  const el = document.getElementById('historial-container');
  if (el) el.innerHTML = renderHistorial();
}

function renderProyeccionTab() {
  const el = document.getElementById('proyeccion-container');
  if (el) el.innerHTML = renderProyeccion();
}

/* ================= RESUMEN ================= */
// Solo agrega datos ya calculados en otras pestañas — no repite fijos del mes ni listado de pagos.
function mesActualNum() {
  const hoy = new Date();
  return (hoy.getFullYear() - MES1_PROY.getFullYear()) * 12 + (hoy.getMonth() - MES1_PROY.getMonth()) + 1;
}

function renderResumen() {
  const sim = runSimulacionProyeccion();
  const mn = mesActualNum();
  const mesActualLabel = mesNumALabel(mn);
  const activas = [...debts].filter(d => d.balance > 0.005).sort((a, b) => b.balance - a.balance);

  const filas = activas.map(d => `
    <div class="debt-row">
      <div class="debt-badge ${d.tipo}"></div>
      <div class="info">
        <div class="name">${d.name}</div>
        <div class="meta">${tipoLabel(d.tipo)} · ${(d.rate*100).toFixed(2)}% APR</div>
      </div>
      <div class="amt">${fmt(d.balance)}</div>
    </div>`).join('') || '<div class="placeholder">🎉 ¡Todas las deudas liquidadas!</div>';

  return `
    <div class="card">
      <h2>Este mes</h2>
      <div class="stat-grid">
        <div class="stat-box"><div class="label">Mes actual</div><div class="value accent" style="font-size:14px;">${mesActualLabel}</div></div>
        <div class="stat-box"><div class="label">Meses hasta libertad</div><div class="value">${sim.totalMonths}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="stat-grid">
        <div class="stat-box"><div class="label">Deuda total</div><div class="value">${fmt(totalDeuda())}</div></div>
        <div class="stat-box"><div class="label">Tasa promedio ponderada</div><div class="value">${(tasaPromedioPonderada()*100).toFixed(2)}%</div></div>
        <div class="stat-box"><div class="label">Interés total proyectado</div><div class="value">${fmt(sim.totalInteres + sim.intEmilio)}</div></div>
        <div class="stat-box"><div class="label">Mínimos combinados</div><div class="value">${fmt(totalMinimos())}/mes</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Deudas activas (${activas.length})</h2>
      ${filas}
    </div>
  `;
}

function renderResumenTab() {
  const el = document.getElementById('resumen-container');
  if (el) el.innerHTML = renderResumen();
}

function renderCreditoTab() {
  const el = document.getElementById('credito-container');
  if (el) el.innerHTML = renderCredito();
}

/* ---------------- Init ---------------- */
(function init() {
  renderDeudasTab();
  renderPagosSemanaTab();
  renderChequesTab();
  renderProyeccionTab();
  renderCreditoTab();
  renderHistorialTab();
  renderResumenTab();
  const lastTab = loadData('du_lasttab', 'resumen');
  if (lastTab && document.getElementById('tab-' + lastTab)) switchTab(lastTab);
})();
</script>
